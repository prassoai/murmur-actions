name: Murmur Spawn
description: >-
  Spawn a murmur agent from a GitHub workflow, optionally wait for it, and return
  its structured output. A composite action that runs the published murmur CLI
  image (docker run … --json) and parses the typed JSON into step outputs,
  authenticated with a service-profile API key (mur_…).

inputs:
  api-key:
    description: A mur_-prefixed service-profile API key. Pass via a secret, never inline.
    required: true
  api-address:
    description: >-
      murmur-api gRPC address as host:port (e.g. api.murmur.dev:9090), set on
      MURMUR_API_ADDRESS. Leave empty to use the CLI's built-in production
      default (api.murmur.dev:9090, TLS on). This is NOT the /mcp HTTP URL the
      old composite action took — the CLI speaks gRPC.
    required: false
    default: ""
  workspace:
    description: Murmur workspace the agent runs in.
    required: true
  prompt:
    description: The agent task description.
    required: true
  slug:
    description: >-
      Agent slug. Required (no silent default) — give re-runs a distinct,
      meaningful slug. A run-scoped value such as
      "gha-<github.run_id>-<github.run_attempt>" works well; build it in the
      caller workflow (action.yml metadata cannot read the github context).
    required: true
  agent-persona:
    description: Agent persona name (resolved from the tenant catalog). Optional.
    required: false
    default: ""
  output-schema:
    description: >-
      JSON Schema for the agent's structured answer — inline JSON, or @path to
      read from a file in the checkout (the action's working directory is the
      checked-out repo). The schema-validated result is returned on the
      structured-output output.
    required: false
    default: ""
  expected-output:
    description: 'Expected artifact: respond, pr, push, diff, report, none, or freeform text.'
    required: false
    default: respond
  on-idle:
    description: >-
      What the agent does once it goes idle: terminate (default — tears the agent
      down so a CI spawn leaves nothing lingering), sleep (stays reachable for
      follow-ups/event wakes), or keep-alive (keep_alive also accepted). CI
      spawns are one-shot, so the default is terminate. A persistent per-PR
      worker overrides this to sleep.
    required: false
    default: terminate
  force-new:
    description: >-
      Start a fresh agent even if one with this slug already exists (e.g. a dead
      agent left over from a prior, since-closed PR that reused the slug). Maps to
      `murmur spawn --force-new`.
    required: false
    default: "false"
  wait:
    description: >-
      Block until the agent reaches a terminal/at-rest phase and surface its
      outputs (default). Set to "false" to fire-and-return: the action spawns the
      agent and exits immediately, emitting only agent-ref. Use false for a
      persistent worker that reports asynchronously (e.g. posts its own PR
      comment), so the CI step stays a thin RPC instead of blocking for the whole
      run.
    required: false
    default: "true"
  model:
    description: Model override. Optional.
    required: false
    default: ""
  reasoning-effort:
    description: 'Reasoning effort: low, medium, high, xhigh, max. Optional.'
    required: false
    default: ""
  purpose:
    description: One-sentence human-readable goal shown in the dashboard. Optional.
    required: false
    default: ""
  tags:
    description: >-
      Comma-separated tag names to attach for dashboard grouping/filtering
      (e.g. "ci,pr-verify"). Maps to repeated `murmur spawn --tag`. Each tag
      must be a DNS-label slug (^[a-z0-9][a-z0-9-]{0,62}$), max 8 per agent —
      the server rejects a non-conforming or over-cap set loudly. A tag that
      does not yet exist is created. Optional.
    required: false
    default: ""
  timeout:
    description: >-
      With wait=true, max seconds to block before failing the step (a client
      deadline; 0 = no client deadline).
    required: false
    default: "600"

outputs:
  structured-output:
    description: The caller-schema result as a JSON string (empty if no output-schema was given).
    value: ${{ steps.run.outputs.structured-output }}
  response:
    description: The agent's human-readable response summary.
    value: ${{ steps.run.outputs.response }}
  agent-ref:
    description: The slug of the spawned agent.
    value: ${{ steps.run.outputs.agent-ref }}
  phase:
    description: The agent's terminal/at-rest phase (empty when wait=false).
    value: ${{ steps.run.outputs.phase }}
  is-error:
    description: '"true" if the agent run errored (empty when wait=false).'
    value: ${{ steps.run.outputs.is-error }}

runs:
  # Composite, not a Docker container action: a container action's process is the
  # only thing that runs, so it cannot post-process the CLI's output. A composite
  # has steps, so it runs the published murmur-cli image with `docker run … --json`
  # and a shell step parses the typed JSON into the action's outputs. The CLI
  # stays format-agnostic (just --json); the GHA-output glue lives here.
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        MURMUR_API_KEY: ${{ inputs.api-key }}
        MURMUR_API_ADDRESS: ${{ inputs.api-address }}
        # The murmur-cli image GHCR-published on every push to main. Tracking
        # `main` keeps the action on the current CLI without a per-bump pin: the
        # action lives in the same repo it targets and runs against the same
        # continuously-deployed control plane, so `main` and the deployed API
        # advance together and stay within the server's MAJOR.0 MinClientVersion.
        MURMUR_IMAGE: ghcr.io/prassoai/murmur-cli:main
        IN_WORKSPACE: ${{ inputs.workspace }}
        IN_SLUG: ${{ inputs.slug }}
        IN_PROMPT: ${{ inputs.prompt }}
        IN_AGENT: ${{ inputs.agent-persona }}
        IN_OUT: ${{ inputs.expected-output }}
        IN_ON_IDLE: ${{ inputs.on-idle }}
        IN_FORCE_NEW: ${{ inputs.force-new }}
        IN_WAIT: ${{ inputs.wait }}
        IN_MODEL: ${{ inputs.model }}
        IN_REASONING: ${{ inputs.reasoning-effort }}
        IN_PURPOSE: ${{ inputs.purpose }}
        IN_TAGS: ${{ inputs.tags }}
        IN_OUTPUT_SCHEMA: ${{ inputs.output-schema }}
        IN_TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail
        # Fail loud up front if a required tool is missing, rather than spawning
        # the agent and then crashing mid-parse: docker runs the CLI image, and
        # (when --wait) jq parses the AgentStatus and openssl mints the heredoc
        # delimiter for the multiline outputs.
        for cmd in docker jq openssl; do
          command -v "$cmd" >/dev/null || { echo "::error::$cmd is required to run this action" >&2; exit 1; }
        done

        # slug_log = slug with CR/LF stripped, for safe use in log lines and the
        # agent-ref $GITHUB_OUTPUT — a workflow command (::error::…) or an output
        # line begins at a newline, so an untrusted slug containing "\n::error::…"
        # could otherwise forge one. The raw $IN_SLUG still goes to the CLI.
        slug_log=${IN_SLUG//[$'\n\r']/}

        # --tag is repeatable on the CLI; the action's tags input is a
        # comma-separated list. Whitespace is stripped per element (a valid tag
        # cannot contain any) and empty elements are dropped; the server
        # validates each tag (DNS-label slug, max 8) and rejects a bad set
        # loudly, so simple comma-splitting cannot smuggle a malformed tag
        # through. The ${arr[@]+…} expansion keeps `set -u` happy on an empty
        # array under pre-4.4 bash.
        tag_args=()
        IFS=',' read -ra tags <<<"$IN_TAGS"
        for t in "${tags[@]}"; do
          t=${t//[[:space:]]/}
          [ -n "$t" ] && tag_args+=("--tag=$t")
        done

        # Spawn the agent. Never --wait here: agent-ref must be emitted before any
        # blocking wait, so a downstream step can reference (or tear down) the
        # agent even if the wait below times out. The workspace is mounted so an
        # --output-schema=@path resolves against the checkout. The mur_ key is
        # forwarded by name (-e), never on the command line. -- terminates flags
        # so a slug/prompt starting with "-" is never read as one.
        docker run --rm \
          -e MURMUR_API_KEY -e MURMUR_API_ADDRESS \
          -v "$GITHUB_WORKSPACE":/github/workspace -w /github/workspace \
          "$MURMUR_IMAGE" spawn --json \
          "--workspace=$IN_WORKSPACE" "--agent=$IN_AGENT" "--out=$IN_OUT" \
          "--on-idle=$IN_ON_IDLE" "--force-new=$IN_FORCE_NEW" \
          "--model=$IN_MODEL" "--reasoning-effort=$IN_REASONING" \
          "--purpose=$IN_PURPOSE" "--output-schema=$IN_OUTPUT_SCHEMA" \
          ${tag_args[@]+"${tag_args[@]}"} \
          -- "$IN_SLUG" "$IN_PROMPT" >/dev/null

        echo "agent-ref=$slug_log" >>"$GITHUB_OUTPUT"

        if [ "$IN_WAIT" != "true" ]; then
          echo "Spawned '$slug_log' (wait=false); not blocking on completion." >&2
          exit 0
        fi

        # Block until the agent is terminal or at rest. --timeout bounds the wait;
        # on expiry the CLI exits non-zero and this step fails with no turn
        # outputs written — a still-running agent has no terminal result, so an
        # `if: always()` consumer must not read partial data.
        status_json=$(docker run --rm \
          -e MURMUR_API_KEY -e MURMUR_API_ADDRESS \
          "$MURMUR_IMAGE" wait --json \
          "--workspace=$IN_WORKSPACE" "--timeout=$IN_TIMEOUT" -- "$IN_SLUG")

        # `wait --json` prints the AgentStatus as protojson (camelCase keys).
        phase=$(jq -r '.phase // ""' <<<"$status_json")
        is_error=$(jq -r '.output.isError // false' <<<"$status_json")
        response=$(jq -r '.output.response // ""' <<<"$status_json")
        structured=$(jq -r '.output.structuredOutput // ""' <<<"$status_json")

        # printf + a random heredoc delimiter so a multiline value (a response or
        # a JSON structured-output) round-trips verbatim.
        emit_multiline() {
          local name="$1" value="$2" delim
          delim="ghadelim_$(openssl rand -hex 16)"
          {
            echo "${name}<<${delim}"
            printf '%s\n' "$value"
            echo "$delim"
          } >>"$GITHUB_OUTPUT"
        }
        {
          echo "phase=$phase"
          echo "is-error=$is_error"
        } >>"$GITHUB_OUTPUT"
        emit_multiline response "$response"
        emit_multiline structured-output "$structured"

        echo "Agent '$slug_log' finished in phase '$phase' (is_error=$is_error)." >&2

        # Fail the step on an agent-reported error or a terminal failure phase,
        # after outputs are written (so an `if: always()` step still sees them).
        if [ "$is_error" = "true" ]; then
          echo "::error::murmur agent '$slug_log' reported an error result" >&2
          exit 1
        fi
        case "$phase" in
          PHASE_FAILED | PHASE_CANCELED)
            echo "::error::murmur agent '$slug_log' ended in phase $phase" >&2
            exit 1
            ;;
        esac
